<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cosmic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark circle background -->
  <circle cx="50" cy="50" r="48" fill="#030712" stroke="url(#cosmic-grad)" stroke-width="2.5" />
  <!-- Orbital rings -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" transform="rotate(-25 50 50)" />
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4" transform="rotate(35 50 50)" />
  <!-- Center Core / S monogram -->
  <circle cx="50" cy="50" r="8" fill="url(#cosmic-grad)" filter="url(#glow)" />
  <text x="50" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="-1">S</text>
  <!-- Orbiting photon -->
  <circle cx="78" cy="36" r="3.5" fill="#22d3ee" filter="url(#glow)" />
</svg>

